<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firestore初期設定</title>
</head>

<body>
  <h1>Firestore初期設定</h1>
  <p id="status">設定を作成しています...</p>

  <script type="module">
    import {
      loadSettings
    } from "./common-firestore.js";

    const status =
      document.getElementById("status");

    async function initialize() {
      try {
        const settings = await loadSettings();

        status.textContent =
          "✅ 初期設定の作成に成功しました！";
      } catch (error) {
        console.error(error);

        status.textContent =
          "❌ 初期設定の作成に失敗しました。\n" +
          error.message;
      }
    }

    initialize();
  </script>
</body>
</html>
