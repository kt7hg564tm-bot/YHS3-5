<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ画面｜お化け屋敷</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <div class="header">
      <h1>👻 スタッフ画面</h1>
      <p>お化け屋敷｜待ち時間管理</p>
    </div>

    <section class="card">
      <h2>現在の状態</h2>

      <div class="notice">
        現在の待ち時間：
        <strong id="currentWait">--</strong>
        <br>
        待ち組数：
        <strong id="currentCount">--</strong>組
        <br>
        受付状態：
        <strong id="currentStatus">--</strong>
      </div>
    </section>

    <section class="card">
      <h2>⚙️ 待ち時間設定</h2>

      <label for="waitCount">
        現在の待ち組数
      </label>

      <input
        id="waitCount"
        type="number"
        min="0"
        step="1"
        value="0"
      >

      <label for="baseMinutes">
        基本待ち時間（分）
      </label>

      <input
        id="baseMinutes"
        type="number"
        min="0"
        step="1"
        value="0"
      >

      <button id="saveButton">
        💾 設定を保存
      </button>

      <p id="message" class="muted"></p>
    </section>

    <section class="card">
      <h2>🚦 受付状態</h2>

      <p class="muted">
        受付を停止すると、来場者画面に
        「受付停止中」と表示されます。
      </p>

      <div class="grid">
        <button id="openButton">
          🟢 受付開始
        </button>

        <button id="closeButton" class="danger">
          🔴 受付停止
        </button>
      </div>
    </section>

    <section class="card">
      <h2>🔄 ページ操作</h2>

      <button
        class="secondary"
        onclick="location.reload()"
      >
        最新状態を読み込む
      </button>
    </section>

    <div class="nav">
      <a class="button secondary" href="index.html">
        ← 来場者画面
      </a>

      <a class="button secondary" href="reserve.html">
        🎟️ 予約画面
      </a>
    </div>

  </main>

  <script type="module">
  import {
    watchSettings,
    saveSettings,
    waitTime
  } from "./common-firestore.js";

  let currentData = null;

  function render(data) {
    currentData = data;

    const minutes = waitTime(data);

    document.getElementById("currentWait").textContent =
      minutes + "分";

    document.getElementById("currentCount").textContent =
      data.waitCount;

    document.getElementById("currentStatus").textContent =
      data.receptionOpen
        ? "受付中"
        : "受付停止中";

    document.getElementById("waitCount").value =
      data.waitCount;

    document.getElementById("baseMinutes").value =
      data.baseMinutes;
  }

  async function saveWaitSettings() {
    if (!currentData) {
      alert("設定データを読み込み中です。");
      return;
    }

    const waitCount =
      Number(document.getElementById("waitCount").value);

    const baseMinutes =
      Number(document.getElementById("baseMinutes").value);

    if (
      !Number.isFinite(waitCount) ||
      waitCount < 0 ||
      !Number.isInteger(waitCount)
    ) {
      alert("待ち組数は0以上の整数で入力してください。");
      return;
    }

    if (
      !Number.isFinite(baseMinutes) ||
      baseMinutes < 0 ||
      !Number.isInteger(baseMinutes)
    ) {
      alert("基本待ち時間は0以上の整数で入力してください。");
      return;
    }

    try {
      await saveSettings({
        waitCount,
        baseMinutes
      });

      document.getElementById("message").textContent =
        "✅ 設定を保存しました。";

    } catch (error) {
      console.error(error);

      document.getElementById("message").textContent =
        "❌ 設定の保存に失敗しました。";
    }
  }

  async function setReceptionOpen(isOpen) {
    try {
      await saveSettings({
        receptionOpen: isOpen
      });

      document.getElementById("message").textContent =
        isOpen
          ? "🟢 受付を開始しました。"
          : "🔴 受付を停止しました。";

    } catch (error) {
      console.error(error);

      document.getElementById("message").textContent =
        "❌ 受付状態の変更に失敗しました。";
    }
  }

  document
    .getElementById("saveButton")
    .addEventListener("click", saveWaitSettings);

  document
    .getElementById("openButton")
    .addEventListener("click", function() {
      setReceptionOpen(true);
    });

  document
    .getElementById("closeButton")
    .addEventListener("click", function() {
      setReceptionOpen(false);
    });

  watchSettings(render);
</script>

</body>
</html>
