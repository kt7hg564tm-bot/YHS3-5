<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ画面｜お化け屋敷</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <div class="header">
      <h1>👻 スタッフ画面</h1>
      <p>お化け屋敷｜待ち時間管理</p>
    </div>

    <section class="card">
  <h2>🎟️ 予約設定</h2>

  <label for="day1Date">
    文化祭 1日目
  </label>

  <input
    id="day1Date"
    type="date"
  >

  <label for="day2Date">
    文化祭 2日目
  </label>

  <input
    id="day2Date"
    type="date"
  >

  <label for="capacityPerSlot">
    1枠の定員（組）
  </label>

  <input
    id="capacityPerSlot"
    type="number"
    min="1"
    step="1"
    value="10"
  >

  <label for="maxPeoplePerGroup">
    1組の最大人数
  </label>

  <input
    id="maxPeoplePerGroup"
    type="number"
    min="1"
    step="1"
    value="4"
  >

  <hr>

  <h3>1日目の予約可能時間</h3>

  <div class="grid">
    <label><input type="checkbox" class="day1-time" value="09:00"> 09:00</label>
    <label><input type="checkbox" class="day1-time" value="09:30"> 09:30</label>
    <label><input type="checkbox" class="day1-time" value="10:00"> 10:00</label>
    <label><input type="checkbox" class="day1-time" value="10:30"> 10:30</label>
    <label><input type="checkbox" class="day1-time" value="11:00"> 11:00</label>
    <label><input type="checkbox" class="day1-time" value="11:30"> 11:30</label>
    <label><input type="checkbox" class="day1-time" value="12:00"> 12:00</label>
    <label><input type="checkbox" class="day1-time" value="12:30"> 12:30</label>
    <label><input type="checkbox" class="day1-time" value="13:00"> 13:00</label>
    <label><input type="checkbox" class="day1-time" value="13:30"> 13:30</label>
    <label><input type="checkbox" class="day1-time" value="14:00"> 14:00</label>
    <label><input type="checkbox" class="day1-time" value="14:30"> 14:30</label>
    <label><input type="checkbox" class="day1-time" value="15:00"> 15:00</label>
  </div>

  <hr>

  <h3>2日目の予約可能時間</h3>

  <div class="grid">
    <label><input type="checkbox" class="day2-time" value="09:00"> 09:00</label>
    <label><input type="checkbox" class="day2-time" value="09:30"> 09:30</label>
    <label><input type="checkbox" class="day2-time" value="10:00"> 10:00</label>
    <label><input type="checkbox" class="day2-time" value="10:30"> 10:30</label>
    <label><input type="checkbox" class="day2-time" value="11:00"> 11:00</label>
    <label><input type="checkbox" class="day2-time" value="11:30"> 11:30</label>
    <label><input type="checkbox" class="day2-time" value="12:00"> 12:00</label>
    <label><input type="checkbox" class="day2-time" value="12:30"> 12:30</label>
    <label><input type="checkbox" class="day2-time" value="13:00"> 13:00</label>
    <label><input type="checkbox" class="day2-time" value="13:30"> 13:30</label>
    <label><input type="checkbox" class="day2-time" value="14:00"> 14:00</label>
    <label><input type="checkbox" class="day2-time" value="14:30"> 14:30</label>
    <label><input type="checkbox" class="day2-time" value="15:00"> 15:00</label>
  </div>

  <hr>

  <h3>予約受付</h3>

  <div class="grid">
    <button id="reservationOpenButton">
      🟢 予約受付開始
    </button>

    <button
      id="reservationCloseButton"
      class="danger"
    >
      🔴 予約停止
    </button>
  </div>

  <button id="saveReservationSettings">
    💾 予約設定を保存
  </button>

  <p id="reservationMessage" class="muted"></p>
</section>
    <section class="card">
      <h2>現在の状態</h2>

      <div class="notice">
        現在の待ち時間：
        <strong id="currentWait">--</strong>
        <br>
        待ち組数：
        <strong id="currentCount">--</strong>組
        <br>
        受付状態：
        <strong id="currentStatus">--</strong>
      </div>
    </section>

    <section class="card">
      <h2>⚙️ 待ち時間設定</h2>

      <label for="waitCount">
        現在の待ち組数
      </label>

      <input
        id="waitCount"
        type="number"
        min="0"
        step="1"
        value="0"
      >

      <label for="baseMinutes">
        基本待ち時間（分）
      </label>

      <input
        id="baseMinutes"
        type="number"
        min="0"
        step="1"
        value="0"
      >

      <button id="saveButton">
        💾 設定を保存
      </button>

      <p id="message" class="muted"></p>
    </section>

    <section class="card">
      <h2>🚦 受付状態</h2>

      <p class="muted">
        受付を停止すると、来場者画面に
        「受付停止中」と表示されます。
      </p>

      <div class="grid">
        <button id="openButton">
          🟢 受付開始
        </button>

        <button id="closeButton" class="danger">
          🔴 受付停止
        </button>
      </div>
    </section>
<section class="card">
  <h2>📋 予約管理</h2>

  <p class="muted">
    予約は時間順に表示されます。
  </p>

  <div id="reservationList">
    読み込み中...
  </div>
</section>
    <section class="card">
      <h2>🔄 ページ操作</h2>

      <button
        class="secondary"
        onclick="location.reload()"
      >
        最新状態を読み込む
      </button>
    </section>

    <div class="nav">
      <a class="button secondary" href="index.html">
        ← 来場者画面
      </a>

      <a class="button secondary" href="reserve.html">
        🎟️ 予約画面
      </a>
    </div>

  </main>

  <script type="module">
  import {
    watchSettings,
    saveSettings,
    waitTime
  } from "./common-firestore.js";
import {
  collection,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  db
} from "./firebase.js";
  let currentData = null;

  function render(data) {
    currentData = data;

    const minutes = waitTime(data);

    document.getElementById("currentWait").textContent =
      minutes + "分";

    document.getElementById("currentCount").textContent =
      data.waitCount;

    document.getElementById("currentStatus").textContent =
      data.receptionOpen
        ? "受付中"
        : "受付停止中";

    document.getElementById("waitCount").value =
      data.waitCount;

    document.getElementById("baseMinutes").value =
      data.baseMinutes;
    document.getElementById("day1Date").value =
  data.day1Date || "";

document.getElementById("day2Date").value =
  data.day2Date || "";

document.getElementById("capacityPerSlot").value =
  data.capacityPerSlot;

document.getElementById("maxPeoplePerGroup").value =
  data.maxPeoplePerGroup;

document.querySelectorAll(".day1-time").forEach((checkbox) => {
  checkbox.checked =
    data.day1AvailableTimes.includes(checkbox.value);
});

document.querySelectorAll(".day2-time").forEach((checkbox) => {
  checkbox.checked =
    data.day2AvailableTimes.includes(checkbox.value);
});
  }

  async function saveWaitSettings() {
    if (!currentData) {
      alert("設定データを読み込み中です。");
      return;
    }

    const waitCount =
      Number(document.getElementById("waitCount").value);

    const baseMinutes =
      Number(document.getElementById("baseMinutes").value);

    if (
      !Number.isFinite(waitCount) ||
      waitCount < 0 ||
      !Number.isInteger(waitCount)
    ) {
      alert("待ち組数は0以上の整数で入力してください。");
      return;
    }

    if (
      !Number.isFinite(baseMinutes) ||
      baseMinutes < 0 ||
      !Number.isInteger(baseMinutes)
    ) {
      alert("基本待ち時間は0以上の整数で入力してください。");
      return;
    }

    try {
      await saveSettings({
        waitCount,
        baseMinutes
      });

      document.getElementById("message").textContent =
        "✅ 設定を保存しました。";

    } catch (error) {
      console.error(error);

      document.getElementById("message").textContent =
        "❌ 設定の保存に失敗しました。";
    }
  }

  async function setReceptionOpen(isOpen) {
    try {
      await saveSettings({
        receptionOpen: isOpen
      });

      document.getElementById("message").textContent =
        isOpen
          ? "🟢 受付を開始しました。"
          : "🔴 受付を停止しました。";

    } catch (error) {
      console.error(error);

      document.getElementById("message").textContent =
        "❌ 受付状態の変更に失敗しました。";
    }
  }
async function saveReservationSettingsData() {
  const day1Date =
    document.getElementById("day1Date").value;

  const day2Date =
    document.getElementById("day2Date").value;

  const capacityPerSlot =
    Number(document.getElementById("capacityPerSlot").value);

  const maxPeoplePerGroup =
    Number(document.getElementById("maxPeoplePerGroup").value);

  const day1AvailableTimes =
    Array.from(
      document.querySelectorAll(".day1-time:checked")
    ).map((checkbox) => checkbox.value);

  const day2AvailableTimes =
    Array.from(
      document.querySelectorAll(".day2-time:checked")
    ).map((checkbox) => checkbox.value);

  if (
    !Number.isInteger(capacityPerSlot) ||
    capacityPerSlot < 1
  ) {
    alert("1枠の定員は1以上の整数で入力してください。");
    return;
  }

  if (
    !Number.isInteger(maxPeoplePerGroup) ||
    maxPeoplePerGroup < 1
  ) {
    alert("1組の最大人数は1以上の整数で入力してください。");
    return;
  }

  try {
    await saveSettings({
      day1Date,
      day2Date,
      capacityPerSlot,
      maxPeoplePerGroup,
      day1AvailableTimes,
      day2AvailableTimes
    });

    document.getElementById("reservationMessage").textContent =
      "✅ 予約設定を保存しました。";

  } catch (error) {
    console.error(error);

    document.getElementById("reservationMessage").textContent =
      "❌ 予約設定の保存に失敗しました。";
  }
}

async function setReservationOpen(isOpen) {
  try {
    await saveSettings({
      reservationOpen: isOpen
    });

    document.getElementById("reservationMessage").textContent =
      isOpen
        ? "🟢 予約受付を開始しました。"
        : "🔴 予約受付を停止しました。";

  } catch (error) {
    console.error(error);

    document.getElementById("reservationMessage").textContent =
      "❌ 予約受付状態の変更に失敗しました。";
  }
}
  document
    .getElementById("saveButton")
    .addEventListener("click", saveWaitSettings);

  document
    .getElementById("openButton")
    .addEventListener("click", function() {
      setReceptionOpen(true);
    });

  document
    .getElementById("closeButton")
    .addEventListener("click", function() {
      setReceptionOpen(false);
    });
document
  .getElementById("saveReservationSettings")
  .addEventListener("click", saveReservationSettingsData);

document
  .getElementById("reservationOpenButton")
  .addEventListener("click", function() {
    setReservationOpen(true);
  });

document
  .getElementById("reservationCloseButton")
  .addEventListener("click", function() {
    setReservationOpen(false);
  });
  watchSettings(render);
</script>

</body>
</html>
