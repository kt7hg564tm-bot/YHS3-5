
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お化け屋敷｜待ち時間</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <div class="header">
      <h1>暗　　鞠</h1>
      <p>四日市高等学校　3-5</p>
    </div>

    <section class="card wait-card">
      <div class="label">現在の待ち時間</div>

      <div id="wait" class="wait">--</div>

      <div id="status" class="status">
        --
      </div>

      <p class="muted">
        現在の待ち組数：
        <span id="count">--</span>組
      </p>

      <p class="muted">
        最終更新：
        <span id="updated">--:--</span>
      </p>
    </section>

    <section class="card">
      <h2>🎟️ 入場予約</h2>

      <p class="muted">
        時間帯を指定して予約できます。
        1枠の定員は組数で管理します。
      </p>

      <a class="button" href="reserve.html">
        予約する
      </a>
    </section>

    <section
  id="closed"
  class="card"
  style="display:none"
>
  <div class="notice">
    🔴 現在、お化け屋敷の受付を停止しています。
  </div>
</section>

<section class="card">
  <h2>🎟️ 予約受付</h2>

  <div
    id="reservationStatus"
    class="notice"
  >
    読み込み中...
  </div>
</section>

    <div class="nav">
      <a class="button secondary" href="reservation.html">
        予約内容を確認
      </a>

      <a class="button secondary" href="admin.html">
        スタッフ画面
      </a>
    </div>

  </>

<script type="module">
  import {
    watchSettings,
    waitTime,
    congestion,
    updatedText
  } from "./common-firestore.js";

  function render(data) {
    const minutes = waitTime(data);
    const result = congestion(minutes);

    document.getElementById("wait").textContent =
      minutes + "分";

    document.getElementById("count").textContent =
      data.waitCount;

    const status =
      document.getElementById("status");

    status.textContent =
      data.receptionOpen
        ? result[0]
        : "受付停止中";

    status.className =
      "status " +
      (data.receptionOpen ? result[1] : "red");

    document.getElementById("updated").textContent =
      updatedText(data.updatedAt);

    document.getElementById("closed").style.display =
      data.receptionOpen ? "none" : "block";
  }

  watchSettings(render);
</script>
