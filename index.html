<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>暗鞠｜四日市高等学校 3-5</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body class="home-page">

  <!-- スタッフ画面へのリンク -->
  <a
    class="home-admin-button"
    href="admin.html"
    aria-label="スタッフ画面"
  >
    ☰
  </a>


  <main class="home-main">

    <!-- =========================
         待ち時間
         ========================= -->
    <section class="home-wait">

      <div class="home-wait-label">
        現在の待ち時間
      </div>

      <div
        id="wait"
        class="home-wait-number"
      >
        --
      </div>

      <div class="home-updated">
        ◷ 最終更新：
        <span id="updated">--:--</span>
      </div>

    </section>


    <!-- =========================
         3つの情報
         ========================= -->
    <section class="home-info-panel">

      <div class="home-info-item">
        <div class="home-info-icon">
          ♙
        </div>

        <div class="home-info-label">
          待ち組数
        </div>

        <div class="home-info-value">
          <span id="count">--</span>組
        </div>
      </div>

<div class="home-info-item home-fear-item">

  <div class="home-info-icon">
    😱
  </div>

  <div class="home-info-label">
    みんなの恐怖度
  </div>

  <div
    id="fearRating"
    class="home-fear-rating"
  >
    --
  </div>

  <div
    id="fearVotes"
    class="home-fear-votes"
  >
    読み込み中...
  </div>

</div>

      <div class="home-info-item">
        <div class="home-info-icon">
          〽
        </div>

        <div class="home-info-label">
          混雑状況
        </div>

        <div
          id="status"
          class="home-congestion"
        >
          --
        </div>
      </div>

    </section>


    <!-- =========================
         お化け屋敷受付状態
         ========================= -->
    <section
      id="receptionNotice"
      class="home-state-panel"
    >
      <div
        id="receptionStatus"
        class="home-state-text"
      >
        読み込み中...
      </div>
    </section>


    <!-- =========================
         予約受付状態
         ========================= -->
    <section class="home-reservation-state">

      <div
        id="reservationStatus"
        class="home-reservation-status"
      >
        読み込み中...
      </div>

    </section>


    <!-- =========================
         予約ボタン
         ========================= -->
    <section class="home-actions">

      <a
        class="home-action home-action-primary"
        href="reserve.html"
      >
        <span class="home-action-icon">
          🎟
        </span>

        <span>
          <strong>予約はこちら</strong>
          <small>入場時間を予約する</small>
        </span>
      </a>


      <a
        class="home-action"
        href="reservation.html"
      >
        <span class="home-action-icon">
          ▣
        </span>

        <span>
          <strong>予約確認</strong>
          <small>あなたの予約を確認</small>
        </span>
      </a>

<a
  class="home-action home-action-comments"
  href="comments.html"
>
  <span class="home-action-icon">
    💬
  </span>

  <span>
    <strong>みんなの感想</strong>
    <small>感想を読む・投稿する</small>
  </span>
</a>
      
    </section>


    <!-- =========================
         フッター
         ========================= -->
    <footer class="home-footer">
      四日市高等学校 3-5
    </footer>

  </main>


  <script type="module">

    import {
      watchSettings,
      waitTime,
      congestion,
      updatedText
    } from "./common-firestore.js";


    function render(data) {

      const minutes =
        waitTime(data);

      const result =
        congestion(minutes);


      // 待ち時間
      document
        .getElementById("wait")
        .textContent =
          minutes + "分";


      // 待ち組数
      document
        .getElementById("count")
        .textContent =
          data.waitCount;


      // 基本待ち時間
      document
        .getElementById("baseMinutes")
        .textContent =
          data.baseMinutes;


      // 混雑状況
      const status =
        document.getElementById(
          "status"
        );

      status.textContent =
        result[0];

      status.className =
        "home-congestion " +
        result[1];


      // 最終更新
      document
        .getElementById("updated")
        .textContent =
          updatedText(
            data.updatedAt
          );


      // お化け屋敷そのものの受付
      const receptionStatus =
        document.getElementById(
          "receptionStatus"
        );

      const receptionNotice =
        document.getElementById(
          "receptionNotice"
        );

      if (data.receptionOpen) {

        receptionStatus.textContent =
          "✓ 現在、お化け屋敷は受付中です";

        receptionNotice.classList.remove(
          "is-closed"
        );

      } else {

        receptionStatus.textContent =
          "⚠ 現在、お化け屋敷の受付を停止しています";

        receptionNotice.classList.add(
          "is-closed"
        );
      }


      // 予約受付
      const reservationStatus =
        document.getElementById(
          "reservationStatus"
        );

      if (data.reservationOpen) {

        reservationStatus.textContent =
          "● 時間指定予約 受付中";

        reservationStatus.className =
          "home-reservation-status is-open";

      } else {

        reservationStatus.textContent =
          "● 現在、予約受付を停止しています";

        reservationStatus.className =
          "home-reservation-status is-closed";
      }
    }


    watchSettings(render);

  </script>

</body>
</html>
