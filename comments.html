<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>みんなの感想｜暗鞠</title>

  <link
    rel="stylesheet"
    href="style.css?v=42"
  >
</head>

<body class="comments-page">

  <main class="container">

    <div class="header comments-header">
      <h1>暗　鞠</h1>
      <p>みんなの感想</p>
    </div>

<!-- 恐怖度投票 -->
<section class="card fear-vote-card">

  <h2>😱 恐怖度を教えて！</h2>

  <p class="muted">
    暗鞠はどれくらい怖かった？
  </p>


  <!-- 怖さの基準 -->
  <div class="fear-scale">

    <div class="fear-level">
      <span class="fear-level-number">1</span>
      <span class="fear-level-label">余裕</span>
      <span class="fear-level-emoji">😎</span>
    </div>

    <div class="fear-level">
      <span class="fear-level-number">2</span>
      <span class="fear-level-label">少し怖い</span>
      <span class="fear-level-emoji">😥</span>
    </div>

    <div class="fear-level">
      <span class="fear-level-number">3</span>
      <span class="fear-level-label">怖い</span>
      <span class="fear-level-emoji">😨</span>
    </div>

    <div class="fear-level">
      <span class="fear-level-number">4</span>
      <span class="fear-level-label">かなり怖い</span>
      <span class="fear-level-emoji">😱</span>
    </div>

    <div class="fear-level">
      <span class="fear-level-number">5</span>
      <span class="fear-level-label">めちゃ怖い</span>
      <span class="fear-level-emoji">💀</span>
    </div>

  </div>


  <!-- 星 -->
  <div
    id="fearStars"
    class="fear-stars"
  >
    <button
      type="button"
      class="fear-star"
      data-rating="1"
      aria-label="恐怖度1"
    >☆</button>

    <button
      type="button"
      class="fear-star"
      data-rating="2"
      aria-label="恐怖度2"
    >☆</button>

    <button
      type="button"
      class="fear-star"
      data-rating="3"
      aria-label="恐怖度3"
    >☆</button>

    <button
      type="button"
      class="fear-star"
      data-rating="4"
      aria-label="恐怖度4"
    >☆</button>

    <button
      type="button"
      class="fear-star"
      data-rating="5"
      aria-label="恐怖度5"
    >☆</button>
  </div>


  <p
    id="fearSelection"
    class="muted fear-selection"
  >
    星をタップして選択してください。
  </p>


  <!-- 1回限りの注意 -->
  <p class="fear-vote-warning">
    ⚠️ この投票は一回しかできないので注意してください。
  </p>


  <button
    id="fearVoteButton"
    class="fear-vote-submit"
    type="button"
    disabled
  >
    投票する
  </button>


  <p
    id="fearVoteMessage"
    class="muted"
  ></p>

</section>
    
    <!-- 投稿フォーム -->
    <section class="card">
      <h2>感想を書く</h2>

      <p class="muted">
        お化け屋敷の感想を自由に書いてください。
      </p>

      <textarea
        id="commentText"
        maxlength="150"
        placeholder="例：最後のところがめっちゃ怖かった！"
      ></textarea>

      <div class="comment-counter">
        <span id="commentLength">0</span>
        / 150文字
      </div>

      <button id="commentSubmitButton">
        投稿する
      </button>

      <p
        id="commentMessage"
        class="muted"
      ></p>
    </section>


    <!-- 感想一覧 -->
    <section class="card">
      <h2>みんなの感想</h2>

      <div id="commentList">
        読み込み中...
      </div>
    </section>


    <div class="nav">
      <a
        class="button secondary"
        href="index.html"
      >
        ← トップページ
      </a>

      <a
        class="button secondary"
        href="reserve.html"
      >
        🎟️ 予約する
      </a>
    </div>

  </main>


  <script type="module">

    import {
      db
    } from "./firebase.js";

import {
  watchSettings
} from "./common-firestore.js";
    
    import {
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  getDoc,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  
    const commentText =
      document.getElementById(
        "commentText"
      );

    const commentLength =
      document.getElementById(
        "commentLength"
      );

    const commentMessage =
      document.getElementById(
        "commentMessage"
      );

    const commentList =
      document.getElementById(
        "commentList"
      );

    let commentsOpen = true;


// ==============================
// 感想受付状態
// ==============================

watchSettings(
  function(data) {

    commentsOpen =
      data.commentsOpen !== false;

    fearVoteVersion =
      Number(
        data.fearVoteVersion
      ) || 1;

    updateFearVoteState();

    const button =
      document.getElementById(
        "commentSubmitButton"
      );

    if (commentsOpen) {

      commentText.disabled =
        false;

      button.disabled =
        false;

      button.textContent =
        "投稿する";

      commentText.placeholder =
        "例：最後のところがめっちゃ怖かった！";

    } else {

      commentText.disabled =
        true;

      button.disabled =
        true;

      button.textContent =
        "感想受付停止中";

      commentText.placeholder =
        "現在、感想の投稿受付を停止しています。";

      commentMessage.textContent =
        "🔴 現在、感想の投稿受付を停止しています。";
    }
  }
);

// ==============================
// 恐怖度投票
// ==============================

const fearStars =
  document.querySelectorAll(
    ".fear-star"
  );

const fearVoteButton =
  document.getElementById(
    "fearVoteButton"
  );

const fearSelection =
  document.getElementById(
    "fearSelection"
  );

const fearVoteMessage =
  document.getElementById(
    "fearVoteMessage"
  );

let fearVoteVersion = 1;

function fearVotedKey() {
  return (
    "fearRatingVoted_" +
    fearVoteVersion
  );
}

let selectedFearRating = 0;


// 評価の説明
const fearLabels = {
  1: "余裕だった",
  2: "少し怖い",
  3: "怖い",
  4: "かなり怖い",
  5: "めちゃくちゃ怖い"
};


// ==============================
// 星の表示
// ==============================

function renderFearStars() {

  fearStars.forEach(
    (star) => {

      const rating =
        Number(
          star.dataset.rating
        );

      star.textContent =
        rating <= selectedFearRating
          ? "★"
          : "☆";
    }
  );
}

// ==============================
// 投票状態を反映
// ==============================

function updateFearVoteState() {

  const alreadyVoted =
    localStorage.getItem(
      fearVotedKey()
    ) === "true";


  if (alreadyVoted) {

    fearStars.forEach(
      (star) => {
        star.disabled = true;
      }
    );

    fearVoteButton.disabled =
      true;

    fearVoteButton.textContent =
      "投票済み";

    fearSelection.textContent =
      "この端末からは投票済みです。";

    return;
  }


  // 新しい投票バージョンなら
  // 再び投票可能にする

  fearStars.forEach(
    (star) => {
      star.disabled = false;
    }
  );

  selectedFearRating = 0;

  renderFearStars();

  fearVoteButton.disabled =
    true;

  fearVoteButton.textContent =
    "投票する";

  fearSelection.textContent =
    "星をタップして選択してください。";

  fearVoteMessage.textContent =
    "";
}

// ==============================
// 星を選択
// ==============================

fearStars.forEach(
  (star) => {

    star.addEventListener(
      "click",
      function() {

        if (
          localStorage.getItem(
            fearVotedKey()
          ) === "true"
        ) {
          return;
        }


        selectedFearRating =
          Number(
            star.dataset.rating
          );


        renderFearStars();


        fearSelection.textContent =
          selectedFearRating +
          "：" +
          fearLabels[
            selectedFearRating
          ];


        fearVoteButton.disabled =
          false;
      }
    );
  }
);


// ==============================
// 投票
// ==============================

fearVoteButton.addEventListener(
  "click",
  async function() {

    if (
      selectedFearRating < 1 ||
      selectedFearRating > 5
    ) {
      return;
    }


    if (
      localStorage.getItem(
        fearVotedKey()
      ) === "true"
    ) {
      return;
    }


    const confirmed =
      confirm(
        "恐怖度 " +
        selectedFearRating +
        " で投票しますか？"
      );


    if (!confirmed) {
      return;
    }


    fearVoteButton.disabled =
      true;

    fearVoteButton.textContent =
      "投票中...";


    try {

      const fearRef =
        doc(
          db,
          "publicStats",
          "fearRating"
        );


      await runTransaction(
        db,
        async (transaction) => {

          const snapshot =
            await transaction.get(
              fearRef
            );


          // 最初の投票
          if (
            !snapshot.exists()
          ) {

            transaction.set(
              fearRef,
              {
                totalScore:
                  selectedFearRating,

                voteCount: 1
              }
            );

            return;
          }


          // 2票目以降
          const data =
            snapshot.data();


          transaction.update(
            fearRef,
            {
              totalScore:
                (
                  Number(
                    data.totalScore
                  ) || 0
                ) +
                selectedFearRating,

              voteCount:
                (
                  Number(
                    data.voteCount
                  ) || 0
                ) + 1
            }
          );
        }
      );


      localStorage.setItem(
        fearVotedKey(),
        "true"
      );


      fearVoteMessage.textContent =
        "✅ 投票ありがとうございました！";

      fearVoteButton.textContent =
        "投票済み";


      fearStars.forEach(
        (star) => {
          star.disabled = true;
        }
      );


    } catch (error) {

      console.error(error);

      fearVoteMessage.textContent =
        "❌ 投票に失敗しました。";

      fearVoteButton.disabled =
        false;

      fearVoteButton.textContent =
        "投票する";
    }
  }
);
    
    // ==============================
    // 文字数表示
    // ==============================

    commentText.addEventListener(
      "input",
      function() {

        commentLength.textContent =
          commentText.value.length;
      }
    );


    // ==============================
    // 感想投稿
    // ==============================

    async function submitComment() {

  if (!commentsOpen) {

    commentMessage.textContent =
      "🔴 現在、感想の投稿受付を停止しています。";

    return;
  }


  const text =
    commentText.value.trim();

  const lastPostKey =
    "lastCommentPostTime";

const lastPostTime =
  Number(
    localStorage.getItem(
      lastPostKey
    )
  ) || 0;

const now =
  Date.now();

const cooldown =
  2 * 60 * 1000;

const remainingTime =
  cooldown -
  (now - lastPostTime);

if (
  remainingTime > 0
) {
  const remainingSeconds =
    Math.ceil(
      remainingTime / 1000
    );

  commentMessage.textContent =
    "連続投稿はできません。あと" +
    remainingSeconds +
    "秒待ってから投稿してください。";

  return;
}

      if (!text) {
        commentMessage.textContent =
          "感想を入力してください。";

        return;
      }


      if (text.length > 150) {
        commentMessage.textContent =
          "感想は150文字以内で入力してください。";

        return;
      }


      const confirmed =
        confirm(
          "この内容で感想を投稿しますか？"
        );


      if (!confirmed) {
        return;
      }


      const button =
        document.getElementById(
          "commentSubmitButton"
        );


      button.disabled = true;

      button.textContent =
        "投稿中...";


      try {

        await addDoc(
          collection(
            db,
            "comments"
          ),
          {
            text,
            likeCount: 0,
            status: "active",
            createdAt:
              serverTimestamp()
          }
        );


        commentText.value = "";

        commentLength.textContent =
          "0";

        commentMessage.textContent =
          "✅ 感想を投稿しました。";
localStorage.setItem(
  lastPostKey,
  String(Date.now())
);

        
      } catch (error) {

        console.error(error);

        commentMessage.textContent =
          "❌ 投稿に失敗しました。";


      } finally {

        button.disabled = false;

        button.textContent =
          "投稿する";
      }
    }


    document
      .getElementById(
        "commentSubmitButton"
      )
      .addEventListener(
        "click",
        submitComment
      );


    // ==============================
    // 感想一覧
    // ==============================

    const commentsQuery =
      query(
        collection(
          db,
          "comments"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    onSnapshot(
      commentsQuery,

      (snapshot) => {

        commentList.innerHTML = "";


        if (
          snapshot.empty
        ) {
          commentList.innerHTML =
            '<p class="muted">まだ感想はありません。</p>';

          return;
        }


        snapshot.forEach(
          (documentSnapshot) => {

            const data =
              documentSnapshot.data();


            if (
              data.status !==
              "active"
            ) {
              return;
            }


            const item =
              document.createElement(
                "div"
              );

            item.className =
              "comment-item";


            const text =
              document.createElement(
                "p"
              );

            text.className =
              "comment-text";

            text.textContent =
              data.text;


            const meta =
              document.createElement(
                "div"
              );

            meta.className =
              "comment-meta";


            if (
              data.createdAt &&
              typeof data.createdAt.toDate ===
                "function"
            ) {

              const date =
                data.createdAt.toDate();

              meta.textContent =
                date.toLocaleString(
                  "ja-JP",
                  {
                    month:
                      "numeric",

                    day:
                      "numeric",

                    hour:
                      "2-digit",

                    minute:
                      "2-digit"
                  }
                );

            } else {

              meta.textContent =
                "投稿直後";
            }


            item.appendChild(
              text
            );

            item.appendChild(
              meta
            );

const likeButton =
  document.createElement(
    "button"
  );

likeButton.className =
  "comment-like-button";

const likedKey =
  "likedComment_" +
  documentSnapshot.id;

const alreadyLiked =
  localStorage.getItem(
    likedKey
  ) === "true";

likeButton.textContent =
  (alreadyLiked ? "❤️ " : "♡ ") +
  (Number(data.likeCount) || 0);

likeButton.disabled =
  alreadyLiked;


likeButton.addEventListener(
  "click",
  async function() {

    if (
      localStorage.getItem(
        likedKey
      ) === "true"
    ) {
      return;
    }

    likeButton.disabled =
      true;

    try {

      const commentRef =
        doc(
          db,
          "comments",
          documentSnapshot.id
        );

      await runTransaction(
        db,
        async (transaction) => {

          const snapshot =
            await transaction.get(
              commentRef
            );

          if (
            !snapshot.exists()
          ) {
            throw new Error(
              "感想が見つかりません。"
            );
          }

          const current =
            snapshot.data();

          transaction.update(
            commentRef,
            {
              likeCount:
                (Number(
                  current.likeCount
                ) || 0) + 1
            }
          );
        }
      );

      localStorage.setItem(
        likedKey,
        "true"
      );

      likeButton.textContent =
        "❤️ " +
        (
          (Number(
            data.likeCount
          ) || 0) + 1
        );

    } catch (error) {

      console.error(error);

      likeButton.disabled =
        false;

      alert(
        "いいねに失敗しました。"
      );
    }
  }
);


item.appendChild(
  likeButton
);
            
            commentList.appendChild(
              item
            );
          }
        );
      },

      (error) => {

        console.error(error);

        commentList.textContent =
          "❌ 感想を読み込めませんでした。";
      }
    );

  </script>

</body>
</html>
