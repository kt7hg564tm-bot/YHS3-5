<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>入場予約｜お化け屋敷</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="reserve-page">
  <main class="container">

  <div class="header reserve-header">
  <h1>暗　鞠</h1>
  <p>入場予約</p>
</div>


    <!-- 予約受付状態 -->
    <section class="card">
      <h2>予約受付</h2>

      <div id="reservationStatus" class="notice">
        読み込み中...
      </div>
    </section>

     <!-- 注意事項 -->
    <section class="card">
      <h2>予約について</h2>

      <p class="muted">
        予約は各予約時刻になるまで受け付けています。
      </p>

      <p class="muted">
        予約完了後に発行される予約番号は、
        予約確認時、入場時に必要になります。
      </p>

      <p class="muted">
        来場者側から予約をキャンセルすることはできません。
      </p>
    </section>

    <!-- 1日目 -->
    <section class="card">
      <h2 id="day1Title">
        文化祭 1日目
      </h2>

      <div id="day1Slots">
        読み込み中...
      </div>
    </section>


    <!-- 2日目 -->
    <section class="card">
      <h2 id="day2Title">
        文化祭 2日目
      </h2>

      <div id="day2Slots">
        読み込み中...
      </div>
    </section>


   


    <div class="nav">
      <a
        class="button secondary"
        href="index.html"
      >
        ← トップページ
      </a>

      <a
        class="button secondary"
        href="reservation.html"
      >
        予約内容を確認
      </a>
    </div>

  </main>


  <script type="module">
  import {
    watchSettings
  } from "./common-firestore.js";

  import {
  createReservation,
  watchReservationSlot
} from "./reservation-firestore.js";


  let currentSettings = null;


  // ==============================
  // 日付表示
  // ==============================

  function formatDate(dateText) {
    if (!dateText) {
      return "日付未設定";
    }

    const parts = dateText.split("-");

    if (parts.length !== 3) {
      return dateText;
    }

    return (
      Number(parts[1]) +
      "月" +
      Number(parts[2]) +
      "日"
    );
  }


  // ==============================
  // 予約時刻をDateに変換
  // ==============================

  function reservationDateTime(
    date,
    time
  ) {
    return new Date(
      date +
      "T" +
      time +
      ":00+09:00"
    );
  }


  // ==============================
  // 予約可能か
  // ==============================

  function isReservationClosed(
    date,
    time
  ) {
    if (!date || !time) {
      return true;
    }

    const startTime =
      reservationDateTime(
        date,
        time
      );

    return (
      Date.now() >=
      startTime.getTime()
    );
  }


  // ==============================
  // 人数選択を作る
  // ==============================

  function createPeopleSelect(
    maxPeople
  ) {
    const select =
      document.createElement("select");

    select.className =
      "people-select";

    for (
      let people = 1;
      people <= maxPeople;
      people++
    ) {
      const option =
        document.createElement(
          "option"
        );

      option.value = people;
      option.textContent =
        people + "人";

      select.appendChild(option);
    }

    return select;
  }


  // ==============================
  // 予約完了表示
  // ==============================

  function showReservationComplete(
    result
  ) {
    const overlay =
      document.createElement("div");

    overlay.style.position =
      "fixed";

    overlay.style.inset =
      "0";

    overlay.style.background =
      "rgba(0, 0, 0, 0.88)";

    overlay.style.zIndex =
      "9999";

    overlay.style.display =
      "flex";

    overlay.style.alignItems =
      "center";

    overlay.style.justifyContent =
      "center";

    overlay.style.padding =
      "20px";


    const card =
      document.createElement("div");

    card.className =
      "card";

    card.style.width =
      "min(500px, 100%)";

    card.innerHTML = `
      <h2>✅ 予約完了</h2>

      <p class="muted">
        あなたの予約番号
      </p>

      <div class="big-code">
        ${result.reservationNumber}
      </div>

      <p>
        <strong>予約日：</strong>
        ${formatDate(result.date)}
      </p>

      <p>
        <strong>予約時間：</strong>
        ${result.time}
      </p>

      <p>
        <strong>人数：</strong>
        ${result.people}人
      </p>

      <div class="notice">
        予約番号は入場時に必要です。
        忘れないようにスクリーンショットをしてください。
      </div>

      <button id="closeReservationResult">
        閉じる
      </button>
    `;

    overlay.appendChild(card);

    document.body.appendChild(
      overlay
    );

    document
      .getElementById(
        "closeReservationResult"
      )
      .addEventListener(
        "click",
        function() {
          overlay.remove();
        }
      );
  }


  // ==============================
  // 予約枠を作る
  // ==============================

  function createSlots(
    element,
    day,
    date,
    times,
    reservationOpen,
    maxPeople
  ) {

    element.innerHTML = "";


    if (!date) {
      element.innerHTML =
        '<p class="muted">日付が設定されていません。</p>';

      return;
    }


    if (
      !times ||
      times.length === 0
    ) {
      element.innerHTML =
        '<p class="muted">予約可能な時間はありません。</p>';

      return;
    }


    times.forEach((time) => {

      const slot =
        document.createElement(
          "div"
        );

      slot.className = "slot";


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "slot-info";


      const strong =
        document.createElement(
          "strong"
        );

      strong.textContent =
        time;


      const description =
        document.createElement(
          "span"
        );


      const closed =
        isReservationClosed(
          date,
          time
        );


      if (closed) {
        description.textContent =
          "予約は終了しました";
      } else if (
        !reservationOpen
      ) {
        description.textContent =
          "予約停止中";
      } else {
        description.textContent =
          "予約受付中";
      }


      info.appendChild(strong);
      info.appendChild(
        description
      );


      const controls =
        document.createElement(
          "div"
        );

      controls.style.display =
        "grid";

      controls.style.gap =
        "8px";


      const peopleSelect =
        createPeopleSelect(
          maxPeople
        );


      const button =
        document.createElement(
          "button"
        );


      if (closed) {
        button.textContent =
          "予約終了";

        button.disabled =
          true;

      } else if (
        !reservationOpen
      ) {
        button.textContent =
          "受付停止";

        button.disabled =
          true;

      } else {
        button.textContent =
          "予約する";

        button.disabled =
          false;
      }
const remaining =
  document.createElement(
    "span"
  );

remaining.textContent =
  "残り枠を確認中...";

info.appendChild(
  remaining
);

if (
  !closed &&
  reservationOpen
) {
  watchReservationSlot(
    date,
    time,
    (slotData) => {
      const reservationCount =
        Number(
          slotData.reservationCount
        ) || 0;

      const capacity =
        Number(
          currentSettings
            ?.capacityPerSlot
        ) || 0;

      const remainingCount =
        capacity -
        reservationCount;

      if (
        remainingCount <= 0
      ) {
        remaining.textContent =
          "満員";

        button.disabled =
          true;

        button.textContent =
          "満員";

      } else {
        remaining.textContent =
          "残り" +
          remainingCount +
          "組";
      }
    }
  );
}

      button.addEventListener(
        "click",
        async function() {

          if (
            !currentSettings
          ) {
            alert(
              "設定を読み込み中です。"
            );

            return;
          }


          const people =
            Number(
              peopleSelect.value
            );


          const confirmed =
            confirm(
              formatDate(date) +
              " " +
              time +
              " に " +
              people +
              "人で予約しますか？"
            );


          if (!confirmed) {
            return;
          }


          button.disabled =
            true;

          button.textContent =
            "予約中...";


          try {

            const result =
              await createReservation({
                day,
                date,
                time,
                people
              });


            showReservationComplete(
              result
            );


            button.textContent =
              "予約完了";


          } catch (error) {

            console.error(error);

            alert(
              error.message ||
              "予約に失敗しました。"
            );


            button.disabled =
              false;

            button.textContent =
              "予約する";
          }
        }
      );


      controls.appendChild(
        peopleSelect
      );

      controls.appendChild(
        button
      );


      slot.appendChild(info);
      slot.appendChild(
        controls
      );


      element.appendChild(
        slot
      );
    });
  }


  // ==============================
  // Firestore設定を反映
  // ==============================

  function render(data) {

    currentSettings = data;


    const status =
      document.getElementById(
        "reservationStatus"
      );


    if (
      data.reservationOpen
    ) {
      status.textContent =
        "🟢 現在、予約受付中です。";
    } else {
      status.textContent =
        "🔴 現在、予約受付を停止しています。";
    }


    document
      .getElementById(
        "day1Title"
      )
      .textContent =
        "文化祭 1日目｜" +
        formatDate(
          data.day1Date
        );


    document
      .getElementById(
        "day2Title"
      )
      .textContent =
        "文化祭 2日目｜" +
        formatDate(
          data.day2Date
        );


    const maxPeople =
      Math.max(
        1,
        Number(
          data.maxPeoplePerGroup
        ) || 1
      );


    createSlots(
      document.getElementById(
        "day1Slots"
      ),
      1,
      data.day1Date,
      data.day1AvailableTimes,
      data.reservationOpen,
      maxPeople
    );


    createSlots(
      document.getElementById(
        "day2Slots"
      ),
      2,
      data.day2Date,
      data.day2AvailableTimes,
      data.reservationOpen,
      maxPeople
    );
  }


  // ==============================
  // 時刻が変わった時の表示更新
  // ==============================

  setInterval(
    function() {
      if (
        currentSettings
      ) {
        render(
          currentSettings
        );
      }
    },
    30000
  );


  // Firestoreリアルタイム監視
  watchSettings(render);

</script>

</body>
</html>
