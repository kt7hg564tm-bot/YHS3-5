<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>入場予約｜お化け屋敷</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <div class="header">
      <h1>🎟️ 入場予約</h1>
      <p>お化け屋敷</p>
    </div>


    <!-- 予約受付状態 -->
    <section class="card">
      <h2>予約受付</h2>

      <div id="reservationStatus" class="notice">
        読み込み中...
      </div>
    </section>


    <!-- 1日目 -->
    <section class="card">
      <h2 id="day1Title">
        文化祭 1日目
      </h2>

      <div id="day1Slots">
        読み込み中...
      </div>
    </section>


    <!-- 2日目 -->
    <section class="card">
      <h2 id="day2Title">
        文化祭 2日目
      </h2>

      <div id="day2Slots">
        読み込み中...
      </div>
    </section>


    <!-- 注意事項 -->
    <section class="card">
      <h2>予約について</h2>

      <p class="muted">
        予約は各予約時刻になるまで受け付けています。
      </p>

      <p class="muted">
        予約完了後に発行される予約番号は、
        入場時に必要になります。
      </p>

      <p class="muted">
        来場者側から予約をキャンセルすることはできません。
      </p>
    </section>


    <div class="nav">
      <a
        class="button secondary"
        href="index.html"
      >
        ← トップページ
      </a>

      <a
        class="button secondary"
        href="reservation.html"
      >
        予約内容を確認
      </a>
    </div>

  </main>


  <script type="module">

    import {
      watchSettings
    } from "./common-firestore.js";


    // 日付を見やすい形にする
    function formatDate(dateText) {
      if (!dateText) {
        return "日付未設定";
      }

      const parts = dateText.split("-");

      if (parts.length !== 3) {
        return dateText;
      }

      return (
        Number(parts[1]) +
        "月" +
        Number(parts[2]) +
        "日"
      );
    }


    // 予約枠を作る
    function createSlots(
      element,
      date,
      times,
      reservationOpen
    ) {

      element.innerHTML = "";

      if (!date) {
        element.innerHTML =
          '<p class="muted">日付が設定されていません。</p>';

        return;
      }

      if (!times || times.length === 0) {
        element.innerHTML =
          '<p class="muted">予約可能な時間はありません。</p>';

        return;
      }


      times.forEach((time) => {

        const slot =
          document.createElement("div");

        slot.className = "slot";


        const info =
          document.createElement("div");

        info.className = "slot-info";


        const strong =
          document.createElement("strong");

        strong.textContent = time;


        const description =
          document.createElement("span");

        description.textContent =
          reservationOpen
            ? "予約受付中"
            : "予約停止中";


        info.appendChild(strong);
        info.appendChild(description);


        const button =
          document.createElement("button");

        button.textContent =
          reservationOpen
            ? "予約する"
            : "受付停止";

        button.disabled =
          !reservationOpen;


        slot.appendChild(info);
        slot.appendChild(button);

        element.appendChild(slot);
      });
    }


    // Firestoreの設定を画面へ反映
    function render(data) {

      const status =
        document.getElementById(
          "reservationStatus"
        );

      if (data.reservationOpen) {
        status.textContent =
          "🟢 現在、予約受付中です。";
      } else {
        status.textContent =
          "🔴 現在、予約受付を停止しています。";
      }


      document.getElementById(
        "day1Title"
      ).textContent =
        "文化祭 1日目｜" +
        formatDate(data.day1Date);


      document.getElementById(
        "day2Title"
      ).textContent =
        "文化祭 2日目｜" +
        formatDate(data.day2Date);


      createSlots(
        document.getElementById(
          "day1Slots"
        ),
        data.day1Date,
        data.day1AvailableTimes,
        data.reservationOpen
      );


      createSlots(
        document.getElementById(
          "day2Slots"
        ),
        data.day2Date,
        data.day2AvailableTimes,
        data.reservationOpen
      );
    }


    // Firestoreをリアルタイム監視
    watchSettings(render);

  </script>

</body>
</html>
